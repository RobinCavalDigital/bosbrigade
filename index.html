<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bosbrigade</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#bfe6ee">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen app. Sky on top, grass at the bottom, chunky paper pieces in between. No reading needed. */
  --sky:#bfe6ee;
  --grass:#7cc36a;
  --moss:#2f6b4f;
  --ink:#17332a;
  --paper:#fff8e7;
  --sun:#ffc93c;
  --berry:#e4572e;
  --pond:#3a9ec2;
  --display:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--ink);
  background:linear-gradient(var(--sky) 0 62%, var(--grass) 62% 100%);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:5px solid var(--ink);outline-offset:3px}
.screen{display:none;height:100%;flex-direction:column;padding:16px;gap:14px;max-width:860px;margin:0 auto}
.screen.on{display:flex}

/* ---------- home ---------- */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vw,4.2rem);line-height:.9;color:var(--moss);
  text-shadow:0 4px 0 var(--paper)}
.case{display:flex;background:var(--paper);border-radius:999px;padding:4px;box-shadow:0 4px 0 rgba(23,51,42,.25)}
.case button{font-family:var(--display);font-weight:800;font-size:1.3rem;padding:4px 16px;border-radius:999px;background:transparent;min-height:48px}
.case button[aria-pressed="true"]{background:var(--moss);color:var(--paper)}
.missions{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:auto;gap:14px;min-height:0;align-content:start;
  overflow-y:auto;padding:4px 4px 14px;-webkit-overflow-scrolling:touch}
.card{min-height:150px;
  background:var(--paper);border-radius:28px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 8px 0 rgba(23,51,42,.28);position:relative;border:6px solid var(--c);transition:transform .12s;
}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(23,51,42,.28)}
.card .who{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1}
.card .sym{font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,4.4vw,1.9rem);line-height:1.1;color:var(--c);white-space:nowrap}
.card .lbl{font-weight:800;font-size:clamp(.9rem,3.2vw,1.15rem);text-align:center}
.card .won{position:absolute;top:8px;right:12px;font-family:var(--display);font-weight:800;font-size:1.05rem}
.note{font-size:.85rem;font-weight:600;text-align:center}

/* ---------- game ---------- */
.bar{display:flex;align-items:center;gap:10px}
.round{width:60px;height:60px;border-radius:50%;background:var(--paper);font-size:1.7rem;box-shadow:0 5px 0 rgba(23,51,42,.28);flex:none}
.round:active{transform:translateY(3px)}
.stars{flex:1;display:flex;justify-content:center;gap:6px;font-size:clamp(1.5rem,6vw,2.2rem)}
.stars span{filter:grayscale(1);opacity:.35;transition:.3s}
.stars span.got{filter:none;opacity:1;transform:scale(1.15)}
.mascot{width:60px;font-size:2.6rem;line-height:1;text-align:center;flex:none}
.mascot.cheer{animation:hop .5s 3}
#play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:14px}

.rowx{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.piece,.hole.letter{
  font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,12vw,4.6rem);line-height:1;
  width:clamp(62px,17vw,128px);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;
}
.piece{background:var(--c);box-shadow:0 8px 0 rgba(23,51,42,.3);touch-action:none;position:relative;z-index:1}
.piece:nth-child(5n+1){--c:var(--sun)}
.piece:nth-child(5n+2){--c:#ff9d7a}
.piece:nth-child(5n+3){--c:#8fd3ea}
.piece:nth-child(5n+4){--c:#b5e39f}
.piece:nth-child(5n+5){--c:#f3b6e0}
.piece.drag{z-index:9;box-shadow:0 18px 14px rgba(23,51,42,.3)}
.piece.sel{outline:6px solid var(--ink);outline-offset:3px}
.piece.nope{animation:shake .4s}
.piece.gone{visibility:hidden}
.hole.letter{background:rgba(255,248,231,.75);border:5px dashed var(--moss);color:rgba(23,51,42,.2)}
.hole.letter.full{border-style:solid;background:var(--paper);color:var(--moss);animation:pop .4s}
.hole.hint{animation:pulse .8s infinite}

.hole.group{background:rgba(255,248,231,.8);border-radius:26px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  width:clamp(96px,28vw,200px);border:5px solid transparent}
.hole.group .nuts{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(1.3rem,5.4vw,2.2rem);line-height:1.1;min-height:2.3em;align-content:center}
.hole.group .slot{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);line-height:1;
  width:clamp(56px,15vw,86px);aspect-ratio:1;border-radius:20px;border:5px dashed var(--moss);display:grid;place-items:center;color:var(--moss)}
.hole.group.full{border-color:var(--moss)}
.hole.group.full .slot{border-style:solid;background:var(--sun);animation:pop .4s}

.mem{display:grid;gap:12px;justify-content:center}
.mcard{
  font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,10vw,4rem);line-height:1;
  width:clamp(70px,20vw,130px);aspect-ratio:1;border-radius:22px;background:var(--moss);color:transparent;
  box-shadow:0 7px 0 rgba(23,51,42,.3);display:grid;place-items:center;position:relative;transition:transform .15s;
}
.mcard::after{content:"🌲";position:absolute;inset:0;display:grid;place-items:center;font-size:.9em;color:initial}
.mcard.open{background:var(--paper);color:var(--ink);transform:scale(1.04)}
.mcard.open::after{content:none}
.mcard.match{background:var(--sun);animation:pop .5s}
.mcard .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:.12em;font-size:.42em;width:3.6em;line-height:1}

.dotwrap{width:min(100%,62vh);aspect-ratio:1;background:rgba(255,248,231,.85);border-radius:28px;box-shadow:0 8px 0 rgba(23,51,42,.2)}
.dotwrap svg{width:100%;height:100%;display:block}
.dotwrap text{font-family:var(--display);font-weight:800;fill:var(--ink)}
.dotwrap .dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.dotwrap .dot.done{fill:var(--moss)}
.dotwrap .dot.nxt{fill:var(--sun);animation:blink .7s infinite}
.dotwrap .hit{fill:transparent;cursor:pointer}
.dotwrap polyline{fill:none;stroke:var(--berry);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.dotwrap polygon{stroke:var(--berry);stroke-width:2.4;stroke-linejoin:round;animation:fadein .5s}
.dotwrap .nopeg{animation:shake .4s}

/* ---------- extra games ---------- */
.nope{animation:shake .4s}
.hint{animation:pulse .8s infinite}
.rowx.tight{gap:8px}
.hole.letter.fixed{color:var(--ink);animation:none}
.hole.letter.sm{width:clamp(46px,13vw,104px);font-size:clamp(1.9rem,9vw,3.8rem);border-radius:16px}
.duo{font-size:.62em;white-space:nowrap}

.field{flex:1;min-height:180px;width:100%;position:relative;overflow:hidden;border-radius:28px}
.field.air{background:rgba(255,248,231,.35)}
.field.pond{background:var(--pond);box-shadow:inset 0 6px 0 rgba(23,51,42,.18)}
.target{display:flex;align-items:center;gap:14px;background:var(--paper);border:6px solid var(--moss);border-radius:24px;padding:2px 18px;
  box-shadow:0 6px 0 rgba(23,51,42,.25)}
.target b{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,4.4rem);line-height:1.1}
.pips{display:flex;gap:8px}
.pips i{width:24px;height:24px;border-radius:50%;border:4px solid var(--moss)}
.pips i.on{background:var(--berry);border-color:var(--berry)}
.bal{position:absolute;width:clamp(70px,18vw,112px);aspect-ratio:.85;border-radius:50%/46% 46% 54% 54%;background:var(--c);
  font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.2rem);line-height:1;
  box-shadow:inset -8px -10px 0 rgba(23,51,42,.1);animation:rise 7s linear forwards}
.bal span,.fish span{display:inline-block;position:relative}
.fish{position:absolute;background:none;font-size:clamp(3rem,12vw,4.6rem);line-height:1;animation:swim linear infinite alternate}
.fish i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1.5em;height:1.5em;border-radius:50%;background:var(--paper);
  border:3px solid var(--ink);display:grid;place-items:center;font:800 .42em var(--display);font-style:normal}

.maze,.odd{display:grid;gap:8px;align-items:center;justify-content:center}
.edge{font-size:clamp(1.8rem,7vw,3rem);width:1.3em;text-align:center;line-height:1}
.edge.cheer{animation:hop .5s 3}
.cell{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,3.2rem);line-height:1;
  width:clamp(48px,14vw,100px);aspect-ratio:1;border-radius:18px;background:var(--paper);box-shadow:0 5px 0 rgba(23,51,42,.28)}
.odd .cell{width:clamp(56px,17vw,108px)}
.cell.walked,.cell.yes{background:var(--sun)}
.cell.yes{outline:6px solid var(--moss);animation:pop .5s}

.pick{background:rgba(255,248,231,.85);border-radius:26px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  width:clamp(120px,38vw,260px);min-height:clamp(140px,30vh,260px);justify-content:center;border:6px solid transparent;box-shadow:0 7px 0 rgba(23,51,42,.25)}
.pick .nuts{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(1.5rem,6vw,2.4rem);line-height:1.1}
.pick .num{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1}
.pick.yes{border-color:var(--moss);background:var(--sun);animation:pop .5s}

.hole.bin{width:clamp(130px,40vw,300px);min-height:clamp(130px,26vh,230px);background:rgba(255,248,231,.8);border:5px dashed var(--moss);
  border-radius:26px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bin .lab{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1;color:var(--moss)}
.bin .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.2;background:var(--sun);border-radius:10px;padding:0 .35em;animation:pop .4s}

#play{--w:clamp(76px,21vw,132px)}
.hole.halfhole{width:var(--w);height:var(--w);box-sizing:content-box;border-radius:20px;background:rgba(255,248,231,.75);border:5px dashed var(--moss);
  display:flex;overflow:hidden}
.hole.halfhole.full{border-style:solid;background:var(--paper);color:var(--moss);animation:pop .4s}
.half{display:block;flex:none;width:calc(var(--w) / 2);height:var(--w);overflow:hidden}
.half>span,.whole{display:block;width:var(--w);height:var(--w);line-height:var(--w);text-align:center;
  font-family:var(--display);font-weight:800;font-size:calc(var(--w) * 1.05)}
.rowx.wide{gap:30px}
.half.r>span{margin-left:calc(var(--w) / -2)}
.piece.halfp{display:block;width:calc(var(--w) / 2);height:var(--w);aspect-ratio:auto;border-radius:0 20px 20px 0;overflow:hidden}

@keyframes rise{from{top:100%}to{top:-30%}}
@keyframes swim{from{left:0}to{left:calc(100% - 1.3em)}}

/* ---------- record sounds (parents) ---------- */
#rec h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);line-height:1;color:var(--moss);flex:1}
#recNote{font-weight:800;font-size:.95rem;line-height:1.35;background:var(--paper);border-radius:16px;padding:10px 14px}
.recgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;align-content:start;padding:2px 2px 12px}
.rc{background:var(--paper);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;border:5px solid transparent}
.rc.has{border-color:var(--moss)}
.rc.recording{background:var(--berry);animation:pulse .5s infinite}
.rc b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.rc div{display:flex;gap:8px}
.rc button{width:46px;height:46px;border-radius:50%;background:var(--sun);font-size:1.2rem;box-shadow:0 4px 0 rgba(23,51,42,.28)}
.rc button:disabled{opacity:.3}
.brand .tools{display:flex;align-items:center;gap:10px}

/* ---------- win ---------- */
#win{align-items:center;justify-content:center;text-align:center;gap:18px}
#win .who{font-size:clamp(5rem,26vw,9rem);line-height:1;animation:hop 1s infinite}
#win .prize{font-size:clamp(2.4rem,10vw,4rem);letter-spacing:.1em}
.big{font-size:2.4rem;background:var(--sun);border-radius:50%;width:92px;height:92px;box-shadow:0 6px 0 rgba(23,51,42,.3)}
.big.alt{background:var(--paper)}
.big:active{transform:translateY(4px)}
.bit{position:fixed;top:-20px;width:14px;height:14px;border-radius:3px;animation:fall linear forwards;pointer-events:none}

@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes pop{50%{transform:scale(1.2)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes blink{50%{opacity:.35}}
@keyframes fadein{from{opacity:0}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
@media (max-height:560px){.card .lbl,.note{display:none}}
</style>
</head>
<body>

<section class="screen on" id="home">
  <div class="brand">
    <h1>Bosbrigade</h1>
    <div class="tools">
      <button class="round" id="btnRec" aria-label="Klanken opnemen (voor ouders)">🎙️</button>
      <div class="case" role="group" aria-label="Soort letters">
        <button id="caseUp" aria-pressed="true">ABC</button>
        <button id="caseLow" aria-pressed="false">abc</button>
      </div>
    </div>
  </div>
  <div class="missions" id="missions"></div>
  <p class="note">Voor ouders: alles werkt met slepen of tikken, lezen hoeft niet.</p>
</section>

<section class="screen" id="game">
  <div class="bar">
    <button class="round" id="btnHome" aria-label="Terug naar het begin">🏠</button>
    <div class="stars" id="stars" aria-label="Voortgang"></div>
    <div class="mascot" id="mascot"></div>
  </div>
  <div id="play"></div>
</section>

<section class="screen" id="rec">
  <div class="bar">
    <button class="round" id="btnRecHome" aria-label="Terug naar het begin">🏠</button>
    <h2>Klanken opnemen</h2>
  </div>
  <p id="recNote">Tik op ⏺ en zeg meteen de klank zoals op school: rrr, mmm, sss. De opname duurt anderhalve seconde en speelt daarna af. Letters zonder opname spreekt de tablet uit als letternaam.</p>
  <div class="recgrid" id="recGrid"></div>
</section>

<section class="screen" id="win">
  <div class="who" id="wWho"></div>
  <div class="prize">⭐🏆⭐</div>
  <div class="rowx">
    <button class="big" id="btnAgain" aria-label="Nog een keer">🔁</button>
    <button class="big alt" id="btnBack" aria-label="Andere missie">🏠</button>
  </div>
</section>

<script>
(function(){
"use strict";
var LETTERS="ABDEFGHIJKLMNOPRSTUVWZ".split("");
var DIGITS="123456789".split("");
var cleanups=[];
function clean(){cleanups.forEach(function(f){f()});cleanups=[]}
var state={caps:true}, cur=null, round=0, wrongs=0, lock=false, timer=null, sel=null;
var $=function(id){return document.getElementById(id)};
var play=$("play");

function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function show(L){return state.caps?L.toUpperCase():L.toLowerCase()}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function each(list,fn){Array.prototype.forEach.call(list,fn)}
function reshake(e,cls){e.classList.remove(cls);void e.getBoundingClientRect();e.classList.add(cls)}

var actx=null;
function tone(f,d,delay,type){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+(delay||0);
    o.type=type||"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
function sRight(){tone(523,.18,0);tone(659,.18,.12);tone(784,.3,.24)}
function sWrong(){tone(220,.25,0,"sine")}
function sTap(i){tone(440+(i||0)*40,.12,0)}
function sWin(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,.25,i*.14)})}

/* Recorded letter sounds: a parent records each klank once; kept on this device in IndexedDB. */
var snd={},db=null,player=null,stream=null,recBusy=false;
function openDB(cb){
  try{
    var r=indexedDB.open("bosbrigade",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("snd")};
    r.onsuccess=function(){db=r.result;cb()};
    r.onerror=function(){cb()};
  }catch(e){cb()}
}
function loadSnd(){
  if(!db)return;
  try{
    var rq=db.transaction("snd").objectStore("snd").openCursor();
    rq.onsuccess=function(){var c=rq.result;if(c){snd[c.key]=URL.createObjectURL(c.value);c.continue()}};
  }catch(e){}
}
function saveSnd(k,blob){
  if(snd[k])URL.revokeObjectURL(snd[k]);
  snd[k]=URL.createObjectURL(blob);
  try{db.transaction("snd","readwrite").objectStore("snd").put(blob,k)}catch(e){}
}
function playSnd(k){
  try{if(player)player.pause();player=new Audio(snd[k]);var pr=player.play();if(pr&&pr.catch)pr.catch(function(){})}catch(e){}
}
function recError(){
  $("recNote").textContent="Opnemen lukt hier niet. Open het spel via het eigen webadres (https) op de tablet en geef toestemming voor de microfoon.";
}
function record(k,cell,playBtn){
  if(recBusy)return;
  function run(){
    var mr,chunks=[];
    try{mr=new MediaRecorder(stream)}catch(e){recError();return}
    recBusy=true;cell.classList.add("recording");
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){
      recBusy=false;cell.classList.remove("recording");
      if(!chunks.length)return;
      saveSnd(k,new Blob(chunks,{type:mr.mimeType||"audio/webm"}));
      cell.classList.add("has");playBtn.disabled=false;playSnd(k);
    };
    mr.start();setTimeout(function(){try{mr.stop()}catch(e){recBusy=false}},1500);
  }
  if(stream){run();return}
  try{
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){stream=st;run()},recError);
  }catch(e){recError()}
}
function stopStream(){
  if(stream){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}stream=null}
}
function recScreen(){
  var g=$("recGrid");g.innerHTML="";
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function(k){
    var cell=el("div","rc"+(snd[k]?" has":""),"<b>"+k+" "+k.toLowerCase()+"</b>"),row=el("div","");
    var r=el("button","","⏺"),p=el("button","","▶");
    r.setAttribute("aria-label","Neem klank "+k+" op");p.setAttribute("aria-label","Speel klank "+k+" af");
    p.disabled=!snd[k];
    r.onclick=function(){record(k,cell,p)};
    p.onclick=function(){playSnd(k)};
    row.appendChild(r);row.appendChild(p);cell.appendChild(row);g.appendChild(cell);
  });
  go("rec");
}

/* Speak the letter or number that was just picked, with the device's best Dutch voice. */
function nlVoice(){
  var list=[];
  try{list=window.speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().replace("_","-").indexOf("nl")===0})}catch(e){}
  function score(v){
    var n=v.name.toLowerCase(),x=0;
    if(/natural|neural|premium|enhanced|verbeterd|online/.test(n))x+=6;
    if(/google/.test(n))x+=3;
    if(/compact|eloquence|espeak/.test(n))x-=4;
    if(v.lang.toLowerCase().replace("_","-")==="nl-nl")x+=1;
    return x;
  }
  return list.sort(function(a,b){return score(b)-score(a)})[0]||null;
}
function say(t){
  try{
    var s=window.speechSynthesis;if(!s)return;
    t=String(t).replace(/\s+/g,"").toLowerCase();if(!t)return;
    s.cancel();
    if(t.length===1&&snd[t.toUpperCase()]){playSnd(t.toUpperCase());return}
    var u=new SpeechSynthesisUtterance(t),v=nlVoice();
    u.lang=v?v.lang:"nl-NL";if(v)u.voice=v;u.rate=.85;u.pitch=1.15;
    s.speak(u);
  }catch(e){}
}
try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}

/* ---------- drag-or-tap matching: pieces go into holes with the same key ---------- */
function matchGame(pieces,holes,onPlace,opts){
  opts=opts||{};
  var left=opts.need||pieces.length;
  function tryPlace(p,h){
    if(lock||!h||h.classList.contains("full"))return;
    if(h.dataset.k===p.dataset.k){
      if(!opts.multi)h.classList.add("full");
      holes.forEach(function(x){x.classList.remove("hint")});p.classList.add("gone");p.classList.remove("sel");sel=null;
      onPlace(p,h);sTap(pieces.length-left);wrongs=0;
      if(--left===0)done();
    }else{
      sWrong();reshake(p,"nope");
      if(++wrongs>=2)holes.forEach(function(x){if(x.dataset.k===p.dataset.k)x.classList.add("hint")});
    }
  }
  pieces.forEach(function(p){
    var sx,sy,moved,active=false;
    function back(){p.style.transition="transform .2s";p.style.transform=""}
    p.addEventListener("pointerdown",function(e){
      if(lock)return;active=true;moved=false;say(p.textContent);sx=e.clientX;sy=e.clientY;
      try{p.setPointerCapture(e.pointerId)}catch(_){}
      p.classList.add("drag");p.classList.remove("nope");p.style.transition="none";
    });
    p.addEventListener("pointermove",function(e){
      if(!active)return;var dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>10)moved=true;
      p.style.transform="translate("+dx+"px,"+dy+"px) scale(1.08)";
    });
    function up(e){
      if(!active)return;active=false;p.classList.remove("drag");
      if(moved){
        p.style.visibility="hidden";
        var t=document.elementFromPoint(e.clientX,e.clientY);
        p.style.visibility="";
        back();
        var h=t&&t.closest?t.closest(".hole"):null;
        if(h)tryPlace(p,h);
      }else{
        back();
        each(play.querySelectorAll(".piece.sel"),function(x){x.classList.remove("sel")});
        sel=p;p.classList.add("sel");sTap(0);
      }
    }
    p.addEventListener("pointerup",up);p.addEventListener("pointercancel",up);
  });
  holes.forEach(function(h){h.addEventListener("click",function(){if(sel)tryPlace(sel,h)})});
}

function start(m){
  cur=m;round=0;

  var s=$("stars");s.innerHTML="";
  for(var i=0;i<m.rounds;i++)s.appendChild(el("span","","⭐"));
  go("game");next();
}
function win(){
  var k="bos-"+cur.id,n=(parseInt(store(k),10)||0)+1;store(k,String(n));
  clean();play.innerHTML="";
  $("wWho").textContent=cur.who;go("win");sWin();
  var cols=["#ffc93c","#e4572e","#3a9ec2","#2f6b4f","#fff8e7"];
  if(!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){
    for(var i=0;i<40;i++){
      var d=el("div","bit");d.style.left=rnd(100)+"vw";d.style.background=cols[i%5];
      d.style.animationDuration=(1.6+Math.random()*1.8)+"s";d.style.animationDelay=(Math.random()*.6)+"s";
      document.body.appendChild(d);setTimeout(function(x){x.remove()},4500,d);
    }
  }
}
function home(){
  clearTimeout(timer);clean();play.innerHTML="";stopStream();
  var box=$("missions");box.innerHTML="";
  MISSIONS.forEach(function(m){
    var b=el("button","card");b.style.setProperty("--c",m.c);
    var n=parseInt(store("bos-"+m.id),10)||0;
    b.innerHTML='<span class="who">'+m.who+'</span><span class="sym">'+m.sym()+'</span><span class="lbl">'+m.lbl+'</span>'+(n?'<span class="won">🏆 '+n+'</span>':'');
    b.onclick=function(){start(m)};
    box.appendChild(b);
  });
  $("caseUp").setAttribute("aria-pressed",String(state.caps));
  $("caseLow").setAttribute("aria-pressed",String(!state.caps));
  go("home");
}
$("caseUp").onclick=function(){state.caps=true;store("bos-caps","1");home()};
$("caseLow").onclick=function(){state.caps=false;store("bos-caps","0");home()};
$("btnHome").onclick=home;
$("btnRecHome").onclick=home;
$("btnRec").onclick=recScreen;
$("btnBack").onclick=home;
$("btnAgain").onclick=function(){start(cur)};

function boot(data){
  openDB(loadSnd);
  var saved=store("bos-caps");
  if(data&&typeof data.caps==="boolean")state.caps=data.caps;
  else if(saved!=null)state.caps=saved!=="0";
  home();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return {caps:state.caps}});
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
</body>
</html>
